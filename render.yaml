services:
  # 1. FastAPI Machine Learning Backend
  - type: web
    name: swaascare-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: cd app && uvicorn main:app --host 0.0.0.0 --port $PORT --timeout-keep-alive 30 --limit-concurrency 10
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: CORS_ORIGINS
        value: "*"
      - key: NUMBA_DISABLE_JIT
        value: "1"
      - key: MALLOC_ARENA_MAX
        value: "2"

  # 2. Next.js Frontend
  - type: web
    name: swaascare-frontend
    runtime: node
    rootDir: frontend
    buildCommand: npm install --legacy-peer-deps && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_VERSION
        value: 18.20.0
      - key: NEXT_PUBLIC_API_URL
        value: https://swaascare-backend.onrender.com
